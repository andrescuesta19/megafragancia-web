<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" fill="none">
  <defs>
    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d98a"/>
      <stop offset="0.3" stop-color="#e8c879"/>
      <stop offset="0.7" stop-color="#c9a96a"/>
      <stop offset="1" stop-color="#8e6438"/>
    </linearGradient>
    <linearGradient id="megaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ebd5"/>
      <stop offset="1" stop-color="#d4c8b0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Corona estilizada -->
  <g transform="translate(380, 35)" fill="none" stroke="url(#goldFill)" stroke-width="2" filter="url(#glow)">
    <path d="M 0 50 L 15 5 L 30 30 L 50 0 L 70 30 L 85 5 L 100 50 L 100 70 L 0 70 Z"/>
    <circle cx="50" cy="20" r="4" fill="url(#goldFill)"/>
  </g>

  <!-- "Mega" en serif clara -->
  <text x="20" y="62" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="500" font-style="italic" fill="url(#megaGrad)" letter-spacing="0.5">Mega</text>

  <!-- "FRAGANCIA" en serif dorada grande -->
  <text x="20" y="120" font-family="'Cinzel', Georgia, serif" font-size="48" font-weight="700" fill="url(#goldFill)" letter-spacing="2" filter="url(#glow)">FRAGANCIA</text>

  <!-- Línea decorativa -->
  <line x1="20" y1="135" x2="200" y2="135" stroke="url(#goldFill)" stroke-width="1" opacity="0.6"/>
  <line x1="220" y1="135" x2="280" y2="135" stroke="url(#goldFill)" stroke-width="1" opacity="0.6"/>

  <!-- Slogan -->
  <text x="20" y="152" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#a89f92" letter-spacing="2.5">PERFUMES ÁRABES Y DE NICHO · 100% ORIGINALES</text>
</svg>
