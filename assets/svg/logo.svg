<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" fill="none">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c1e"/>
      <stop offset="1" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8a87a"/>
      <stop offset="0.5" stop-color="#b8895a"/>
      <stop offset="1" stop-color="#8e6438"/>
    </linearGradient>
  </defs>

  <!-- Frasco estilizado -->
  <g transform="translate(0, 0)">
    <rect x="22" y="6" width="14" height="10" rx="2" fill="url(#cap)"/>
    <rect x="26" y="16" width="6" height="4" fill="#7a5a3a"/>
    <rect x="6" y="20" width="46" height="38" rx="6" fill="url(#body)"/>
    <rect x="10" y="24" width="6" height="30" rx="3" fill="#fff" opacity="0.25"/>
  </g>

  <!-- Texto principal -->
  <text x="64" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#1f1a14" letter-spacing="1.5">MEGA FRAGANCIA</text>

  <!-- Tagline / slogan -->
  <text x="64" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#8e6438" letter-spacing="1.8">PERFUMES ÁRABES Y DE NICHO · 100% ORIGINALES</text>
</svg>
