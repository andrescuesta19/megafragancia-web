# netlify.toml — Mega Fragancia

[build]
  # Sitio estático con funciones serverless
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Cabeceras de seguridad aplicadas a todo el sitio
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "accelerometer=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()"
    Content-Security-Policy = "default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.netlify.app; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# Cache para assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Cache para páginas de políticas
[[headers]]
  for = "/politicas/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Variables de entorno (configurar en Netlify Dashboard → Site settings → Environment variables)
# - GITHUB_TOKEN: Personal Access Token con scope 'repo'
# - GITHUB_REPO: andrescuesta19/megafragancia-web (opcional, ya tiene default)
# - GITHUB_BRANCH: main (opcional, ya tiene default)
# - ADMIN_PASSWORD: mega2026 (opcional, ya tiene default)
